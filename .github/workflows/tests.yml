name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # CPU-only packages the tests import. No model is downloaded: tests that need llama.cpp models,
      # HailoRT or a UGen300 skip themselves.
      - name: Install test dependencies
        run: python -m pip install pytest numpy opencv-python-headless pillow onnx
      - name: Run tests
        run: python -m pytest -q -p no:cacheprovider
